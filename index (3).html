<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firmas · Generador de firma de email</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Space+Grotesk:wght@700&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f2ee;--card:#fff;--ink:#111;--mut:#6b6b6b;--line:#e2ded7;--acc:#f39c12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1c1c;--ink:#f2f2f2;--mut:#9a9a9a;--line:#333}}
:root[data-theme="dark"]{--bg:#121212;--card:#1c1c1c;--ink:#f2f2f2;--mut:#9a9a9a;--line:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 48px}
h1{font-family:Oswald,sans-serif;font-weight:600;font-size:40px;margin:0}
.sub{color:var(--mut);margin:2px 0 22px}
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 4px}
input[type=text]{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.chk label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-weight:600}
.prev{overflow-x:auto;background:#fff;border-radius:10px;padding:14px;border:1px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:var(--ink);color:var(--bg)}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{font-size:13px;color:var(--mut);margin-top:10px;min-height:18px}

#hola{position:fixed;inset:0;z-index:10;background:#0c0c0c;color:#f2f2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;transition:opacity .5s}
#hola.off{opacity:0;pointer-events:none}
#hola svg{width:min(560px,86vw);height:auto;margin-bottom:18px}
#hola .t1{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.6s ease forwards}#hola .t2{opacity:0;animation:fi 1.2s .4s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}
#hola .eb{font-size:13px;letter-spacing:.38em;color:#777;margin:10px 0 18px}
#hola h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(38px,7vw,64px);margin:0 0 22px}
#hola p.d{max-width:600px;color:#b8b8b8;font-size:19px;line-height:1.7;margin:0 0 34px}#hola p.d b{color:#f5a623}
#hola button{background:#f5a623;color:#0c0c0c;font-size:20px;padding:16px 34px;border-radius:12px}
#hola img{width:90px;margin-top:34px}
.autor{position:fixed;right:14px;bottom:10px;z-index:20;font-size:12px;color:#8a8a8a}
</style></head><body><section id="hola"><svg viewBox="0 0 320 110" aria-label="Trazo de firma"><path class="t2" d="M10 92 C60 84 200 80 310 90" stroke="#7a5517" stroke-width="1.4" fill="none"/><path class="t1" pathLength="1" d="M4 62 C14 28 36 6 46 26 C56 48 34 70 34 50 C34 26 66 24 74 40 C82 58 58 70 60 52 C62 34 94 28 108 42 C118 52 100 62 98 48 C112 36 124 34 136 30 C146 26 152 8 162 12 C174 18 168 42 180 44 C192 44 198 24 212 22 C228 22 232 42 244 38 C252 36 256 30 258 28" stroke="#f5a623" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>

const $=i=>document.getElementById(i);
const F=['nombre','puesto','tel','mail','web1','web2'];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sig(){
 const v={};F.forEach(k=>v[k]=esc($(k).value.trim()));
 const logos=['ed','mt','mg'].filter(k=>$('l_'+k).checked).map((k,i,a)=>`<td valign="middle" style="padding:0 ${i<a.length-1?10:0}px 0 0;line-height:0"><img src="${LOGOS[k].src}" width="${LOGOS[k].w}" height="${LOGOS[k].h}" alt="" style="display:block;border:0"></td>`).join('');
 const row=(ic,t)=>t?`<tr><td width="34" style="padding:7px 10px 7px 0"><img src="${ICONS[ic]}" width="26" height="26" alt="" style="display:block;border:0"></td><td style="padding:7px 0;color:#ffffff;font:700 15px 'Source Sans 3',Arial,sans-serif;line-height:1.25">${t}</td></tr>`:'';
 const webs=[v.web1,v.web2].filter(Boolean).join('<br>');
 return `<table cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border-collapse:collapse"><tr>
<td valign="middle" style="padding:8px 22px 8px 8px;width:330px"><div style="font:600 30px Oswald,'Arial Narrow',Arial,sans-serif;color:#111;margin:0 0 8px">${v.nombre}</div><div style="font:700 16px 'Source Sans 3',Arial,sans-serif;color:#111;margin:0 0 16px">${v.puesto}</div><table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;white-space:nowrap"><tr>${logos}</tr></table></td>
<td width="2" style="background:#111111;width:2px"></td>
<td valign="middle" style="padding:8px 8px 8px 22px"><table cellpadding="0" cellspacing="0" border="0" style="background:#000000;border-radius:16px"><tr><td style="padding:14px 22px 14px 18px"><table cellpadding="0" cellspacing="0" border="0">${row('tel',v.tel)}${row('mail',v.mail)}${row('web',webs)}</table></td></tr></table></td></tr></table>`;
}
function render(){$('prev').innerHTML=sig()}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',render));
const say=t=>{$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',2800)};
$('b1').onclick=()=>{const r=document.createRange();r.selectNode($('prev').firstElementChild);const s=getSelection();s.removeAllRanges();s.addRange(r);let ok=false;try{ok=document.execCommand('copy')}catch(e){}s.removeAllRanges();say(ok?'Firma copiada. Pegala en Gmail → Configuración → Firma.':'No se pudo copiar, usá “Copiar HTML”.')};
$('b2').onclick=async()=>{try{await navigator.clipboard.writeText(sig());say('HTML copiado.')}catch(e){say('No se pudo copiar.')}};
$('b3').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html><meta charset="utf-8">'+sig()],{type:'text/html'}));a.download='firma.html';a.click()};
// Datos desde link: ?nombre=...&puesto=...&tel=...&mail=...&web1=...&web2=...&logos=ed,mt,mg
try{const q=new URLSearchParams(location.search);F.forEach(k=>{if(q.has(k))$(k).value=q.get(k)});if(q.has('logos')){const s=q.get('logos').split(',');['ed','mt','mg'].forEach(k=>$('l_'+k).checked=s.includes(k))}}catch(e){}
$('b4').onclick=async()=>{const q=new URLSearchParams();F.forEach(k=>q.set(k,$(k).value));q.set('logos',['ed','mt','mg'].filter(k=>$('l_'+k).checked).join(','));const u=location.origin+location.pathname+'?'+q;try{await navigator.clipboard.writeText(u);say('Link copiado.')}catch(e){say('No se pudo copiar.')}};
const h=new Date().getHours();$('saludo').textContent=h>=6&&h<13?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
$('go').onclick=()=>{$('hola').classList.add('off');setTimeout(()=>$('hola').style.display='none',500)};
render();
</script></body></html>
